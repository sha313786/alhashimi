<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#df9b24"/>
      <stop offset="50%" stop-color="#f5d076"/>
      <stop offset="100%" stop-color="#b87b14"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2c"/>
      <stop offset="100%" stop-color="#060910"/>
    </linearGradient>
  </defs>
  <!-- Background Shield / Rounded Box -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <!-- Gold Accent Inner Glow Line -->
  <rect x="6" y="6" width="52" height="52" rx="10" fill="none" stroke="rgba(223, 155, 36, 0.25)" stroke-width="1"/>
  <!-- Monogram AH -->
  <text x="32" y="41" font-family="'Cinzel', 'Times New Roman', serif" font-size="25" font-weight="800" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">AH</text>
  <!-- Decorative Star/Sparkle -->
  <polygon points="32,9 33.5,13 37.5,13.5 34,16 35.5,20 32,17.5 28.5,20 30,16 26.5,13.5 30.5,13" fill="url(#goldGrad)"/>
</svg>
